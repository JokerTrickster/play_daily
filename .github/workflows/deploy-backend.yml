name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Clean workspace before checkout
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          sudo chmod -R u+w $GITHUB_WORKSPACE || true
          sudo rm -rf $GITHUB_WORKSPACE/* $GITHUB_WORKSPACE/.*  || true
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Update test database schema
        working-directory: ./backend/src
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          echo "Updating test database schema..."

          # Check and add room_password column to users table if missing
          docker run -i --rm mysql:8.0 mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD daily_test <<'EOF' 2>&1 | grep -v "Warning" || true
            SET @col_exists = (
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'daily_test'
              AND TABLE_NAME = 'users'
              AND COLUMN_NAME = 'room_password'
            );

            SET @query = IF(@col_exists = 0,
              'ALTER TABLE users ADD COLUMN room_password VARCHAR(4) NOT NULL DEFAULT ''0000'' COMMENT ''방 비밀번호 (4자리)'' AFTER default_room_id;',
              'SELECT ''users.room_password column already exists'' AS info;'
            );

            PREPARE stmt FROM @query;
            EXECUTE stmt;
            DEALLOCATE PREPARE stmt;
          EOF

          # Check and add room_password column to rooms table if missing
          docker run -i --rm mysql:8.0 mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD daily_test <<'EOF' 2>&1 | grep -v "Warning" || true
            SET @col_exists = (
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'daily_test'
              AND TABLE_NAME = 'rooms'
              AND COLUMN_NAME = 'room_password'
            );

            SET @query = IF(@col_exists = 0,
              'ALTER TABLE rooms ADD COLUMN room_password VARCHAR(4) NOT NULL DEFAULT ''0000'' COMMENT ''방 입장 비밀번호 (4자리)'' AFTER name, ADD INDEX idx_room_password (room_password);',
              'SELECT ''rooms.room_password column already exists'' AS info;'
            );

            PREPARE stmt FROM @query;
            EXECUTE stmt;
            DEALLOCATE PREPARE stmt;
          EOF

          # Check and add is_public column to rooms table if missing
          docker run -i --rm mysql:8.0 mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD daily_test <<'EOF' 2>&1 | grep -v "Warning" || true
            SET @col_exists = (
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'daily_test'
              AND TABLE_NAME = 'rooms'
              AND COLUMN_NAME = 'is_public'
            );

            SET @query = IF(@col_exists = 0,
              'ALTER TABLE rooms ADD COLUMN is_public TINYINT(1) NOT NULL DEFAULT 0 COMMENT ''공개 방 여부 (1=공개, 0=비공개)'' AFTER room_password, ADD INDEX idx_is_public (is_public);',
              'SELECT ''rooms.is_public column already exists'' AS info;'
            );

            PREPARE stmt FROM @query;
            EXECUTE stmt;
            DEALLOCATE PREPARE stmt;
          EOF

          # Check and add bio column to users table if missing
          docker run -i --rm mysql:8.0 mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD daily_test <<'EOF' 2>&1 | grep -v "Warning" || true
            SET @col_exists = (
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'daily_test'
              AND TABLE_NAME = 'users'
              AND COLUMN_NAME = 'bio'
            );

            SET @query = IF(@col_exists = 0,
              'ALTER TABLE users ADD COLUMN bio VARCHAR(500) NULL COMMENT ''사용자 자기소개'' AFTER profile_image_url;',
              'SELECT ''users.bio column already exists'' AS info;'
            );

            PREPARE stmt FROM @query;
            EXECUTE stmt;
            DEALLOCATE PREPARE stmt;
          EOF

          # Check and create tokens table if missing
          docker run -i --rm mysql:8.0 mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD daily_test <<'EOF' 2>&1 | grep -v "Warning" || true
            CREATE TABLE IF NOT EXISTS tokens (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              user_id BIGINT UNSIGNED NOT NULL COMMENT '사용자 ID (FK to users table)',
              access_token VARCHAR(500) NOT NULL COMMENT 'JWT Access Token',
              refresh_token VARCHAR(500) NOT NULL UNIQUE COMMENT 'JWT Refresh Token (unique, single-use)',
              access_token_expires_at TIMESTAMP NOT NULL COMMENT 'Access Token 만료 시간',
              refresh_token_expires_at TIMESTAMP NOT NULL COMMENT 'Refresh Token 만료 시간',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP COMMENT '토큰 생성 시간',
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '토큰 업데이트 시간',
              revoked_at TIMESTAMP NULL DEFAULT NULL COMMENT '토큰 무효화 시간 (NULL = active)',
              INDEX idx_user_id (user_id),
              INDEX idx_access_token (access_token),
              INDEX idx_refresh_token (refresh_token),
              INDEX idx_expires_at (access_token_expires_at, refresh_token_expires_at),
              INDEX idx_revoked_at (revoked_at),
              FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='JWT Token Storage for Revocation and Rotation';
          EOF

          echo "✓ Test database schema updated"

      - name: Run E2E Tests
        working-directory: ./backend/src
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 3306
          DB_NAME: daily_test
          GO_ENV: local
        run: |
          echo "Running E2E tests on test database (daily_test)..."
          go test -v ./tests/e2e -run "TestAuthFlow|TestCategoryFlow" -timeout 120s

      - name: Test Results
        if: failure()
        run: |
          echo "❌ Tests failed - deployment blocked"
          exit 1

  deploy:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Clean workspace before checkout
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          sudo chmod -R u+w $GITHUB_WORKSPACE || true
          sudo rm -rf $GITHUB_WORKSPACE/* $GITHUB_WORKSPACE/.* || true
        continue-on-error: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Stop existing container
        run: |
          docker stop play-daily-backend || true
          docker rm play-daily-backend || true
        continue-on-error: true

      - name: Remove old image
        run: |
          docker rmi play-daily-backend:latest || true
        continue-on-error: true

      - name: Create .env file
        working-directory: ./backend
        run: |
          cat > .env.production << EOF
          HOST=0.0.0.0
          PORT=7001
          ENV=production
          DEBUG=false

          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=daily_dev
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_HOURS=24

          UPLOAD_PATH=./uploads
          MAX_FILE_SIZE=10485760

          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_ENDPOINT=

          ALLOWED_ORIGINS=*

          LOG_LEVEL=info
          LOG_FILE=logs/app.log
          EOF

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build --no-cache -t play-daily-backend:latest .

      - name: Run Docker container
        run: |
          docker run -d \
            --name play-daily-backend \
            --network host \
            --restart unless-stopped \
            --env-file ./backend/.env.production \
            -v $(pwd)/backend/logs:/root/logs \
            -v $(pwd)/backend/uploads:/root/uploads \
            play-daily-backend:latest

      - name: Wait for container to start
        run: sleep 5

      - name: Check container status
        run: |
          docker ps | grep play-daily-backend
          docker logs play-daily-backend

      - name: Health check
        run: |
          max_attempts=10
          attempt=0
          until curl -f http://localhost:7001/health || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt+1))
            echo "Health check attempt $attempt/$max_attempts failed, retrying in 3s..."
            sleep 3
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Health check failed after $max_attempts attempts"
            docker logs play-daily-backend
            exit 1
          fi

          echo "Backend is healthy!"

      - name: Cleanup unused Docker resources
        run: |
          echo "Cleaning up unused Docker images and containers..."

          # Remove dangling images (untagged)
          docker image prune -f

          # Remove unused images (not attached to any container)
          docker image prune -a -f --filter "until=168h"

          # Remove stopped containers older than 1 day
          docker container prune -f --filter "until=24h"

          # Remove unused volumes
          docker volume prune -f

          # Show disk usage before and after
          echo "Docker disk usage after cleanup:"
          docker system df

          # Optional: Remove all build cache older than 7 days
          docker builder prune -f --filter "until=168h" || true

          # Remove .env file
          rm -f ./backend/.env.production

      - name: Fix workspace permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          sudo chmod -R u+w $GITHUB_WORKSPACE || true
        continue-on-error: true
